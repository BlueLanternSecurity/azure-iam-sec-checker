[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "azure-iam-sec-checker"
version = "0.1.0"
description = "Read-only security checks for Microsoft Entra ID: risky service principals, privileged roles and conditional access gaps."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Blue Lantern Security Inc." }]
keywords = ["azure", "entra", "iam", "security", "service-principal", "microsoft-graph"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Information Technology",
    "Intended Audience :: System Administrators",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
]
dependencies = [
    "click>=8.1,<9",
    "python-dotenv>=1.0",
    "requests>=2.31",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
azure-iam-sec-checker = "azure_iam.cli:main"
azure-iam = "azure_iam.cli:main"

[project.urls]
Homepage = "https://github.com/BlueLanternSecurity/azure-iam-sec-checker"
Issues = "https://github.com/BlueLanternSecurity/azure-iam-sec-checker/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
azure_iam = ["data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
